[project]
name = "seo-audit-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vinnayakk Bangarwaa", email = "bangarwaa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "langfuse>=4.17.0",
    "mcp[cli]>=2.3.0",
    "openai>=3.35.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
seo-audit = "seo_audit_agent.agent:main"
seo-eval = "seo_audit_agent.evals:main"
seo-judge = "seo_audit_agent.judge:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]
